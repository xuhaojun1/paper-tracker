categories: ["cs.CV", "cs.LG", "cs.AI"]
keywords:
  - "video generation"
  - "world model"
  - "vision-language-action"
  - "VLA"
  - "3D reconstruction"
  - "VGGT"
  - "3D Gaussian"

# exclude_keywords: # 选择排除的关键词
#   - "Large Language Model"
#   - "LLM"
  
logic: "AND"                 # 组间逻辑：categories 与 keywords 间 AND/OR（仅 arXiv 备用搜索时生效）
max_results: 200
sort_by: "lastUpdatedDate"
sort_order: "descending"

# —— 数据源设置 ——
# 主源：HuggingFace Daily Papers（社区热门），arXiv 仅用于补全元数据
sources:
  hf_limit: 100              # 从 HF Daily Papers API 拉取的最大条数
  top_k: 30                  # 本地关键词+热度打分后保留的候选数
  arxiv_workers: 8           # arXiv 元数据补全的并发线程数
  arxiv_timeout: 15          # arXiv 单次请求超时（秒）

# zh / en / both
lang: "both"

# —— 摘要设置 ——
# mode: none / heuristic / llm
summary:
  mode: llm # mode: "heuristic"
  # scope: tldr / full / both
  scope: "both"

# —— 邮件发送（QQ 邮箱） ——
# sender / smtp_user / to 统一通过环境变量 EMAIL_ADDR 注入，避免泄露邮箱
# 如需分别指定，可设 EMAIL_SENDER / SMTP_USER / EMAIL_TO 环境变量
email:
  enabled: true
  subject: "[Paper Tracker] 论文速递"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"  # auto / ssl / starttls
  debug: false     # true 可打印 SMTP 调试日志
  detail: "full"  # simple / full
  max_items: 50
  attach_md: true  # 是否开启Markdown附件
  attach_pdf: false  # 是否开启PDF附件

# —— LLM（OpenAI 兼容中转站） ——
llm:
  provider: "openai-compatible"     # 兼容 OpenAI SDK 的服务
  base_url: "https://api.agicto.cn/v1"
  model: "deepseek-v3.2"
  api_key_env: "OPENAI_COMPAT_API_KEY"

# —— LLM 预筛选（基于标题+摘要片段，让 LLM 选择最相关的论文） ——
# 只对选中的论文生成详细摘要和翻译，其余论文仅保留基本信息，节省 token
filter:
  enabled: true
  top_k: 50              # 最多保留几篇（从 max_results 中打分筛选）
  # prompt: ""           # 可选自定义筛选 prompt，留空则使用默认（基于 keywords 判断相关性）

# —— 中文翻译设置（用 LLM 翻译 title/summary） ——
translate:
  enabled: true         # 是否启用
  lang: "zh"            # 目前只需中文；也可扩展 en/ja 等
  fields: ["title", "summary"]   # 可扩：["title","summary","comments"]

site:
  enabled: true
  dir: "docs" 
  title: "Paper Tracker 论文速递"
  keep_runs: 20           # 历史保留期（按页面份数，约 5 个月）
  theme: "light"        # "light" | "dark" | "auto"
  accent: "#2563eb"     # 主题色（可自定义）

freshness:
  since_days: 7              # 只看最近 N 天内新提交/更新（与一周 cron 周期匹配）
  unique_only: true       # 开启跨天去重（见过的 arXiv ID 不再重复发）
  state_path: ".state/seen.json"  # 去重状态文件（会随 docs 一起提交保存）
  fallback_when_empty: false # 当今天无新增时，是否回退展示最近的Top若干（建议false）

scrape:
  html: true               # 先用 HTML 页抓链接
  pdf_if_missing: true     # 若没抓到 code，再去扫 PDF 头部兜底
  pdf_first_page: false    # （可保留为 false；若你想"不管有没有都扫 PDF"，设 true）
  timeout: 10
  html_fulltext: true      # 抓取 arXiv HTML 全文，提取 method/experiment 等章节供 LLM 总结
  html_fulltext_timeout: 15
